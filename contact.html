<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FanZone - Contact Us</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="img/logo/logo_blanche.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding-top: 60px;
        }
        .navbar {
            background-color: #121212;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }
        .navbar a {
            color: #fff;
            padding: 10px 30px;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 500;
            transition: background-color 0.3s ease, color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 20px;
        }
        .navbar a:hover {
            background-color: #007BFF;
            color: #fff;
        }
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 60px;
            padding: 20px;
        }
        header h1 {
            font-size: 2em;
            color: #121212;
        }
        .contact-container {
            display: flex;
            justify-content: center;
            margin-top: 40px;
            flex-direction: column;
            align-items: center;
        }
        .contact-button {
            background-color: #007BFF;
            color: #fff;
            padding: 12px 24px;
            font-size: 1.1em;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            margin: 10px 0;
            transition: background-color 0.3s, transform 0.2s;
            display: flex;
            align-items: center;
        }
        .contact-button:hover {
            background-color: #0056b3;
            transform: translateY(-3px);
        }
        .contact-button i {
            margin-right: 10px; /* Add space between icon and text */
        }
        footer {
            margin-top: 30px;
            background-color: #121212;
            color: #fff;
            text-align: center;
            padding: 1em 0;
        }
        @media (max-width: 767px) {
            .navbar {
                display: flex;
                align-items: center; /* توسيط الروابط */
            }
            .navbar a {
                font-size: 16px; /* تصغير حجم النص */
                padding: 10px 14px; /* تصغير التباعد بين العناصر */
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <a href="index.html">الرئيسية</a>
        <a href="products.html">منتجات</a>
        <a href="contact.html" class="active">اتصل بنا</a>
        <a href="about.html">معلومات عنا</a>
    </div>

    <!-- Header -->
    <header>
        <h1>اتصل بنا</h1>
    </header>

    <!-- Contact Options -->
    <div class="contact-container">
        <!-- WhatsApp Button with Icon -->
        <button class="contact-button" onclick="window.open('https://wa.me/+21213837457', '_blank')">
            <i class="fab fa-whatsapp"></i> تواصل معنا على الواتس اب
        </button>

        <!-- Gmail Button with Icon -->
        <button class="contact-button" onclick="window.location.href='mailto:hamzachentouf0@gmail.comsubject=Inquiry&body=Hello,%20I%20have%20a%20question%20about%20your%20products.'">
            <i class="fab fa-google"></i> اتصل بنا عبر الجيميل
        </button>
    </div>

    <footer>
        <p>All rights reserved &copy; 2025 FanZone Store</p>
    </footer>

</body>
</html>
